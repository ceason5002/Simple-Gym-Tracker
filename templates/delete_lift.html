{% extends "base.html" %}
{% block content %}
  <div class="card card-narrow reveal" style="margin-top:48px">
    <h1>Delete Lift</h1>
    <p>Delete <b>{{ lift.name }}</b>? This can't be undone.</p>

      {% csrf_token %}
      <button type="submit" class="danger">Confirm delete</button>
    </form>
  </div>
{% endblock %}
